spring:
    application:
        name: shop
    docker:
        compose:
            lifecycle-management: start-only   # tắt app không tắt DB, khởi động lại nhanh hơn
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate                 # schema chỉ thay đổi qua Flyway
    mvc:
        problemdetails:
            enabled: true
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8180/realms/ecommerce   # tokens must come from this realm
                    audiences: ecommerce-api                             # and must be meant for this API
    cache:
        type: redis
        redis:
            enable-statistics: true   # hit/miss counters, visible in /actuator/metrics
    mail:
        host: localhost
        port: 1025
    data:
        redis:
            timeout: 500ms           # a dead Redis costs half a second, not a minute
            connect-timeout: 500ms

management:
    endpoint:
        health:
            show-details: always               # dev: xem được trạng thái DB trong /actuator/health
            group:
                readiness:
                    include: readinessState,db   # only what the app cannot work without
    endpoints:
        web:
            exposure:
                include: health,metrics
    health:
        mail:
            enabled: false

ecommerce-java:
    inventory:
        reservation-ttl: PT15M         # how long reserved units stay held for an unpaid order
        expiry-check-interval: PT30S
        expiry-batch-size: 100
    payment:
        gateway-url: http://localhost:9090
        webhook-secret: dev-webhook-secret   # must match fake-payment
        connect-timeout: 1s
        read-timeout: 3s                     # shorter than fake-payment's lost-response delay (10s)
        reconcile-after: PT1M
        give-up-after: PT10M
    ordering:
        payment-timeout: PT30M
        max-orders-per-minute: 10   # per customer; raise it for load tests
    reporting:
        zone: Asia/Ho_Chi_Minh   # the business day starts at midnight in this time zone
    notification:
        from: no-reply@ecommerce.local
