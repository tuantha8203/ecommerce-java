services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop        # chỉ dùng cho máy dev
    ports:
      - "5432:5432"                  # cổng cố định để mở bằng DBeaver/IntelliJ
    volumes:
      - shop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  keycloak:
    image: quay.io/keycloak/keycloak:26.4   # check quay.io for the newest 26.x tag
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin   # admin console of Keycloak itself, local only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"                        # 8080 is already taken by the shop
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
  
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP: the shop sends mail here
      - "8025:8025"   # web UI: read the mail at http://localhost:8025

volumes:
  shop-pgdata: